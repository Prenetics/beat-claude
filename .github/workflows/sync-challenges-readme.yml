name: Sync Open Challenges table

# Keeps the README "Open Challenges" table in sync with the active challenges/
# folder. When a challenge is archived (moved to challenges/archive/) or added,
# the table regenerates automatically — no manual README edits.

on:
  push:
    branches: [main]
    paths:
      - 'challenges/**'
      - 'scripts/gen_challenges_table.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/gen_challenges_table.py
      - name: Commit regenerated README if changed
        run: |
          if git diff --quiet README.md; then
            echo "README Open Challenges table already in sync."
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: auto-sync Open Challenges table [skip ci]"
            git push
          fi
